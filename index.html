<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somewhere.exe</title>
  <link rel="stylesheet" href="css/xp-theme.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/taskbar.css">
  <link rel="stylesheet" href="css/windows.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/atmosphere.css">
  <link rel="stylesheet" href="css/boot.css">
</head>
<body>
  <div id="desktop-root">
    <!-- Wallpaper -->
    <div id="wallpaper"></div>
    <div id="wallpaper-overlay"></div>
    <div id="film-grain"></div>
    <div id="vignette"></div>

    <!-- Desktop icon area -->
    <div id="desktop-icons"></div>

    <!-- System dialog container -->
    <div id="system-dialog-container"></div>

    <!-- Clock panel -->
    <div id="clock-panel" hidden></div>

    <!-- Window container -->
    <div id="window-container"></div>

    <!-- Taskbar -->
    <div id="taskbar">
      <button id="start-btn" aria-label="开始菜单">
        <img src="assets/start.png" alt="start">
      </button>
      <div id="task-buttons"></div>
      <div id="system-tray">
        <span id="tray-volume" class="tray-icon" title="音量"><img src="assets/icons/xp/16/volume.png" alt="" width="16" height="16"></span>
        <span id="tray-network" class="tray-icon" title="网络"><img src="assets/icons/xp/16/network.png" alt="" width="16" height="16"></span>
        <div id="tray-clock"></div>
      </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" hidden>
      <!-- Header banner: username + avatar -->
      <div class="start-header">
        <span class="start-username">Lynn</span>
        <div class="start-avatar"><img src="assets/icons/xp/48/user-key.png" alt=""></div>
      </div>
      <!-- Two-column body -->
      <div class="start-body">
        <div class="start-col-left">
          <div id="start-menu-left"></div>
          <div class="start-hsep"></div>
          <div class="start-allprograms" id="start-all-programs">
            <span class="ap-icon"><img src="assets/icons/xp/32/windows-logo.png" alt=""></span>
            <span class="ap-label">所有程序</span>
            <span class="ap-arrow">&#9654;</span>
          </div>
        </div>
        <div class="start-col-right">
          <div id="start-menu-right"></div>
        </div>
      </div>
      <!-- Footer: log off + turn off -->
      <div id="start-menu-bottom">
        <button class="start-bottom-btn" data-action="logout">
          <img src="assets/icons/xp/16/users-group.png" alt=""> 注销
        </button>
        <button class="start-bottom-btn" data-action="shutdown">
          <img src="assets/icons/xp/16/shutdown.png" alt=""> 关闭计算机
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/state.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/taskbar.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
